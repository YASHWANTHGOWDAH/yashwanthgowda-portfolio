name: Keep Alive 24/7

on:
  schedule:
    # Run every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Web Service
        run: |
          curl -s -f https://yashwanthgowda-portfolio.onrender.com > /dev/null || echo "Ping request sent"
